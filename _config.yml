title: Startup Guide
description: >-
  A practical playbook for first-time technical founders
  — founding or joining while the company is still early.
baseurl: "/startup-guide"
url: "https://cliffweng.github.io"

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

color_scheme: light

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

nav_sort: case_insensitive
heading_anchors: true

mermaid:
  version: "9.1.6"

defaults:
  # English pages are the default. zh/ mirrors them in Traditional Chinese.
  # The header/sidebar toggle links a page to the file with the same name.
  - scope:
      path: ""
    values:
      lang: en
  - scope:
      path: "topics"
    values:
      permalink: /topics/:basename/
  - scope:
      path: "zh"
    values:
      lang: zh-TW
  - scope:
      path: "zh/topics"
    values:
      lang: zh-TW
      permalink: /zh/topics/:basename/

aux_links:
  "View on GitHub":
    - "https://github.com/cliffweng/startup-guide"
aux_links_new_tab: true

footer_content: "Copyright &copy; 2026 Cliff Weng. Distributed under the MIT License."

back_to_top: true
back_to_top_text: "Back to top"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - CONTRIBUTING.md
